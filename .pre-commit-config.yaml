repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: libera_utils/data/icie_xtce_tlm.xml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            tests/test_data/.*|
            libera_utils/data/.*
          )$
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev]
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.8"
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        files: ^.*\.(py|md|rst|yml)$
  - repo: https://github.com/lasp/prevent-dangling-todos
    rev: v1.0.0
    hooks:
      - id: prevent-dangling-todos
        args: ["-t", "LIBSDC,CURRYER", "-c", "TODO,FIXME", "--check-unstaged"]
        exclude: ".pre-commit-config.yaml"
        verbose: true
        always_run: true
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      # Entry overridden from the upstream default
      # (`betterleaks git --pre-commit --staged`), which only ever scans the staged
      # diff and therefore finds nothing under `pre-commit run --all-files` in CI.
      # Scanning the filenames pre-commit hands us means CI checks every tracked
      # file, no matter how old, while gitignored files (e.g. the real credentials
      # in .claude/settings.local.json) are never read.
      - id: betterleaks
        name: Detect hardcoded secrets
        entry: betterleaks dir --redact --verbose --no-banner
        pass_filenames: true
