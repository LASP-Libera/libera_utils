name: Change
description: A change to the code that a person can check when it is done
title: "[change] "
labels: [change]
body:
  - type: input
    id: jira
    attributes:
      label: Jira key
      description: >
        LIBSDC-NNNN if this work has a Jira ticket, which is the ticket of record for
        planned work. Leave blank for work that starts here; the plan step will ask.
    validations: { required: false }

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        Top-down. First, which function of this repository the problem stops or degrades;
        then the specific failure, request, or science reason. Link the data or the source.
    validations: { required: true }

  - type: textarea
    id: driving
    attributes:
      label: Driving requirements
      description: >
        What the work must accomplish: the point of the ticket, in a couple of sentences or
        bullets.
    validations: { required: true }

  - type: textarea
    id: technical
    attributes:
      label: Technical requirements
      description: >
        Lower-level requirements. Optional up front; they can be settled during estimation.
        Requirements, not an implementation plan.
    validations: { required: false }

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: >
        Numbered, one to seven. Each one something a test or a person can check.
        For an epic, each one is a child ticket.
      placeholder: |
        1. Given ..., when ..., then ...
        2. ...
    validations: { required: true }

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: >
        What this change does not do, even if it is adjacent and tempting. Leave blank only
        if nothing adjacent is tempting; the monthly revision counts how often it is blank,
        which is how the field earns or loses its place.
    validations: { required: false }

  - type: textarea
    id: considerations
    attributes:
      label: Considerations
      description: >
        Areas of code the work is likely to touch and potential gotchas; interfaces that must
        not change; rule IDs (R-) and decisions (D-) that apply, and shared standards/context/
        entries (standards/SHARED.md says where they live); the epic; the downstream
        repositories a change here reaches; open questions.
    validations: { required: false }
