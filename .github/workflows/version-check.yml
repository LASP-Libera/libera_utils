name: Version check

# What it checks, on every pull request:
#   1. The first "## <version>" heading in doc/source/changelog.md equals the version in
#      pyproject.toml.
#   2. When the pull request changes pyproject.toml's version line, the new version is above the
#      highest release tag (a bare tag such as 5.11.1; v-prefixed and rc tags are ignored).
#
# Why it exists: a release is cut by pushing a tag, and pypi-publish.yml publishes whatever
# version pyproject.toml carries. A changelog heading that disagrees with it mislabels the
# release notes, and a version at or below the newest tag repeats or predates a published
# release. Reviewers raised both by hand on five merged pull requests before this became a check:
# rule R-012, with its reasoning in libera_llm_tooling at standards/archive/libera_utils/R-012.md.
#
# What it does not check: whether a bump should be minor or patch; that judgment stays with the
# author, under R-012 in the instruction file. Nor does a pull request that leaves the version
# line alone get the tag comparison: a dependency update edits pyproject.toml without bumping,
# and a branch stacked on another can sit below the newest tag.
#
# What a failure means: the job passes and leaves a warning annotation; the MISMATCH line above
# it names the two values that disagree. Setting the repository variable VERSION_CHECK_MODE to
# "blocking" makes it fail the pull request instead. A check that cannot run (exit 2, a CANNOT
# RUN line naming the missing heading, tag or file) fails the job whatever VERSION_CHECK_MODE
# says: a check that silently passes when it reads nothing is worse than none.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODE: ${{ vars.VERSION_CHECK_MODE || 'informational' }}

jobs:
  version:
    name: Changelog heading matches pyproject.toml; a version bump is above the newest tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag and the base branch, for the tag comparison and the version-line diff.
          fetch-depth: 0

      - name: Compare the changelog heading, the version and the tags
        env:
          MODE: ${{ env.MODE }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail

          flag=""
          if git diff "origin/${BASE_REF}...HEAD" -- pyproject.toml | grep -qE '^\+version\s*='; then
            flag="--bumped"
          fi

          rc=0
          python3 .github/scripts/check_version.py $flag || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error::The version check could not run: the CANNOT RUN line above says why. This fails whatever VERSION_CHECK_MODE says."
            exit 2
          fi

          if [ "$MODE" = "blocking" ]; then
            level=error
          else
            level=warning
          fi
          echo "::${level}::The version does not line up: the MISMATCH line above names the changelog heading and the pyproject.toml version, or the bumped version and the highest tag. Make the first changelog heading equal the version, and bump above the newest tag. Rule R-012."

          if [ "$MODE" = "blocking" ]; then
            exit 1
          fi
          echo "VERSION_CHECK_MODE is '$MODE', so this is a note rather than a failure."
          exit 0
