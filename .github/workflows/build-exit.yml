name: Build exit line

# Annotates a pull request by a person that carries neither a machine-readable Build-exit line
# nor a No-build-gates line. Nothing else stops a pull request reaching a reviewer without
# having been through the build's review loop, because the skills are triggered by hand. The
# no-build-gates label is optional, a filter for the revision, and is never required; a label
# with no line is reported, since the label alone gives no reason. Pull requests opened by bots
# are skipped: dependency updates and Copilot's pull requests never carry either line.
#
# A pre-commit hook would be the wrong layer: pre-commit runs on every fix commit inside the
# build, so it would fire before the build has finished.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Informational until the team says otherwise: the job annotates and passes. Flip the
# repository variable BUILD_EXIT_MODE to "blocking" to make a missing line fail the PR.
# A variable rather than an edit here, so switching it is a settings change and not a
# pull request that itself has to satisfy the check.
env:
  MODE: ${{ vars.BUILD_EXIT_MODE || 'informational' }}

jobs:
  exit-line:
    name: PR body has a Build-exit or No-build-gates line
    if: github.event.pull_request.user.type != 'Bot' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check the exit line
        env:
          # Through the environment, never interpolated into the script: a pull request
          # body is attacker-controlled text.
          MODE: ${{ env.MODE }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          exit_line=$(printf '%s' "$PR_BODY" \
            | grep -E '^Build-exit: (clean|capped|flapping|blocked|halted)[[:space:]]*$' \
            | head -1 || true)

          if [ -n "$exit_line" ]; then
            echo "$exit_line"
            exit 0
          fi

          skip_reason=$(printf '%s' "$PR_BODY" \
            | grep -E '^No-build-gates: .+' | head -1 || true)

          if [ -n "$skip_reason" ]; then
            echo "$skip_reason"
            exit 0
          fi

          case ",$LABELS," in
            *,no-build-gates,*) has_label=1 ;;
            *) has_label=0 ;;
          esac

          if [ "$MODE" = "blocking" ]; then
            level=error
          else
            level=warning
          fi

          if [ "$has_label" = "1" ]; then
            echo "::${level}::The no-build-gates label is set but the body has no line saying why: add 'No-build-gates: <why>' on its own line."
          else
            echo "::${level}::Add one line to the body saying how the build ended: 'Build-exit: <outcome>' from the build, or 'No-build-gates: <why>' for a change made by hand."
          fi
          echo
          echo "    Build-exit: clean | capped | flapping | blocked | halted"
          echo "    No-build-gates: <why>"
          echo
          echo "Build-exit comes from the implementation reviewer's last verdict. capped, flapping and"
          echo "blocked are not failures to hide - they say a bound was hit and a person should look."
          echo

          if [ "$MODE" = "blocking" ]; then
            exit 1
          fi
          echo "BUILD_EXIT_MODE is '$MODE', so this is a note rather than a failure."
          exit 0
