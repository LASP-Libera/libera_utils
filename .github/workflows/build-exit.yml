name: Build exit

# Fails a pull request that carries neither a machine-readable Build-exit line nor a
# no-build-gates label with a reason. Nothing else stops a pull request reaching a reviewer
# without having been through the build's review loop, because the skills are triggered by
# hand.
#
# A pre-commit hook would be the wrong layer: pre-commit runs on every fix commit inside the
# build, so it would fire before the build has finished.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Informational until the team says otherwise: the job annotates and passes. Flip the
# repository variable BUILD_EXIT_MODE to "blocking" to make a missing line fail the PR.
# A variable rather than an edit here, so switching it is a settings change and not a
# pull request that itself has to satisfy the check.
env:
  MODE: ${{ vars.BUILD_EXIT_MODE || 'informational' }}

jobs:
  exit-line:
    name: Body declares how the build ended
    runs-on: ubuntu-latest
    steps:
      - name: Check the exit line
        env:
          # Through the environment, never interpolated into the script: a pull request
          # body is attacker-controlled text.
          MODE: ${{ env.MODE }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          exit_line=$(printf '%s' "$PR_BODY" \
            | grep -E '^Build-exit: (clean|capped|flapping|blocked|halted)[[:space:]]*$' \
            | head -1 || true)

          if [ -n "$exit_line" ]; then
            echo "$exit_line"
            exit 0
          fi

          skip_reason=$(printf '%s' "$PR_BODY" \
            | grep -E '^No-build-gates: .+' | head -1 || true)

          case ",$LABELS," in
            *,no-build-gates,*) has_label=1 ;;
            *) has_label=0 ;;
          esac

          if [ "$has_label" = "1" ] && [ -n "$skip_reason" ]; then
            echo "$skip_reason"
            exit 0
          fi

          if [ "$MODE" = "blocking" ]; then
            level=error
          else
            level=warning
          fi

          echo "::${level}::This pull request says nothing about how the build ended."
          echo
          echo "Add one of these to the body, on its own line:"
          echo
          echo "    Build-exit: clean | capped | flapping | blocked | halted"
          echo
          echo "from the implementation reviewer's last verdict. capped, flapping and blocked are"
          echo "not failures to hide - they say a bound was hit and a person should look."
          echo
          echo "If the change was not built through implement-change, add the no-build-gates label"
          echo "AND a reason line:"
          echo
          echo "    No-build-gates: <why>"
          echo
          if [ "$has_label" = "1" ] && [ -z "$skip_reason" ]; then
            echo "The no-build-gates label is set but the body carries no 'No-build-gates:' reason."
          fi

          if [ "$MODE" = "blocking" ]; then
            exit 1
          fi
          echo "BUILD_EXIT_MODE is '$MODE', so this is a note rather than a failure."
          exit 0
