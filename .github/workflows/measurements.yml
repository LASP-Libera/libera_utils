name: Rule budget

# Checks one number: the review rule text (the ledger in standards/review-rules.md plus the
# wording in the instruction file) fits the line budget standards/README.md states. It runs
# only when those files change, so an ordinary code pull request never sees it. The README
# also states lane test counts; those move with every test a colleague adds, so the revision
# re-measures them by hand with check_measurements.py --lanes rather than CI.
#
# Informational: set the repository variable MEASUREMENTS_MODE to
# "blocking" once the numbers have been true for a while.

on:
  pull_request:
    paths:
      - "standards/**"
      - ".github/instructions/**"
      - ".github/scripts/check_measurements.py"
      - ".github/workflows/measurements.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measurements:
    name: Review rule text fits the budget in standards/README.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"

      - name: Check the stated measurements
        run: |
          set -o pipefail
          if poetry run python .github/scripts/check_measurements.py; then
            exit 0
          fi
          if [ "${{ vars.MEASUREMENTS_MODE }}" = "blocking" ]; then
            echo "::error::check_measurements.py found a number stated in standards/ that no longer holds; the lines above name it."
            exit 1
          fi
          echo "::warning::check_measurements.py found a number stated in standards/ that no longer holds; the lines above name it. MEASUREMENTS_MODE is not 'blocking', so this is a note."
          exit 0
