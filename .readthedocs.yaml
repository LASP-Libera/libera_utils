version: 2

build:
  os: "ubuntu-24.04"
  tools:
    # Keep this at 3.12 or newer. Sphinx 9.1 requires >=3.12, so a 3.11 builder silently resolves
    # back to Sphinx 9.0.4, which (a) stringifies pydantic Annotated[...] metadata into unresolvable
    # types.Annotated references and (b) trips over the stdlib int.from_bytes/to_bytes docstrings our
    # IntEnums inherit. Both are builder artifacts rather than defects in our docstrings, and
    # fail_on_warning below turns them into a failed build.
    python: "3.13"
  jobs:
    post_create_environment:
      # Install poetry
      - pip install poetry
    post_install:
      # Install dependencies. Our doc building dependencies are kept in the docgen dependency group
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with docgen --without dev

formats:
  - pdf

sphinx:
  configuration: doc/source/conf.py
  # The build is warning clean, so any new warning is a regression worth failing on. This is what
  # catches things like a subpackage silently dropping out of the API docs.
  fail_on_warning: true
