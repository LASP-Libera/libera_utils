    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud layer areal coverage, lower layer (CERES SSF) (within-footprint standard deviation) (NOAA20)
      units: "percent"
  ssf_layer_coverage_upper:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud layer areal coverage, upper layer (CERES SSF) (NOAA20)
