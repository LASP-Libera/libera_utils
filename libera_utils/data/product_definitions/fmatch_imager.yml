      units: "percent"
  ssf_cloud_optical_depth_lower:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (CERES SSF imager lower layer) (NOAA20)
      units: "1"
  ssf_cloud_optical_depth_lower_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (CERES SSF imager lower layer) (within-footprint standard deviation) (NOAA20)
