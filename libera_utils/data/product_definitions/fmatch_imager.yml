    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth, upper layer (CERES SSF) (NOAA20)
      units: "1"
  ssf_cloud_optical_depth_upper_standard_deviation:
    dtype: float32
