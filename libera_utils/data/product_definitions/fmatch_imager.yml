# =============================================================================
# FMATCH-IMAGER Data Product Definition
# =============================================================================
# The radiometer-timescale FMATCH-IMAGER product at RBSP Climate Quality latency:
# one footprint per RADIOMETER_TIME. It carries the RBSP CLDPIX/SSF cloud fields
# alongside the full ERA5 single-level and pressure-level field set and the VIIRS
# imager fields. The pressure-level fields are 2-D on (RADIOMETER_TIME, PRESSURE_LEVEL),
# all 37 levels (see _ERA5_PRESSURE_LEVELS in readers/era5_pressure.py).
# The active reader set is declared in FMATCH_MODE_READERS[IMAGER]
# (readers/registry.py).
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER
  algorithm_version: null
  InputGranules: null # TODO[LIBSDC-822]: Update once umm-g writer is implemented

coordinates:
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Radiometer footprint observation time
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  PRESSURE_LEVEL:
    dtype: float32
    dimensions: ["PRESSURE_LEVEL"]
    attributes:
      long_name: ERA5 pressure level
      standard_name: air_pressure
      units: hPa
      positive: down

variables:
  # ---------------------------------------------------------------------------
  # (a) Geolocation inputs (from L1B Daily): lat, lon, alt, sza, vza, raa.
  # ---------------------------------------------------------------------------
  latitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight latitude
      units: degrees_north
  longitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight longitude
      units: degrees_east
  altitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      # This value is the L1B RAD `Altitude` field: the height above the WGS84 ellipsoid
      # (EPSG:4979) of the boresight's geolocated point -- NOT the ~835 km spacecraft altitude.
      long_name: Footprint boresight surface height above the WGS84 ellipsoid
      units: meters
  solar_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Solar zenith angle
      units: degrees
  viewing_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Viewing zenith angle
      units: degrees
  relative_azimuth_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Relative azimuth angle between Sun and sensor
      units: degrees

  # ---------------------------------------------------------------------------
  # (b) Derived viewing geometry
  # ---------------------------------------------------------------------------
  sunglint_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # (c) PSF-aggregated external variables (one value per footprint).
  # ---------------------------------------------------------------------------
  # --- source reader: cldpix (resolution 1.0 km) ---
  cldpix_cloud_optical_depth:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (NOAA20)
      units: "1"
  cldpix_cloud_optical_depth_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (within-footprint standard deviation) (NOAA20)
      units: "1"
  cldpix_cloud_water_path:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud water path (NOAA20)
      units: "g/m^2"
  cldpix_cloud_water_path_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud water path (within-footprint standard deviation) (NOAA20)
      units: "g/m^2"
  cldpix_cloud_effective_temperature:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective temperature (NOAA20)
      units: "K"
  cldpix_cloud_effective_temperature_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective temperature (within-footprint standard deviation) (NOAA20)
      units: "K"
  cldpix_cloud_effective_height:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective height (NOAA20)
      units: "km"
  cldpix_cloud_effective_height_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective height (within-footprint standard deviation) (NOAA20)
      units: "km"
  cldpix_cloud_effective_pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective pressure (NOAA20)
      units: "hPa"
  cldpix_cloud_effective_pressure_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective pressure (within-footprint standard deviation) (NOAA20)
      units: "hPa"
  cldpix_cloud_top_height:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud top height (NOAA20)
      units: "km"
  cldpix_cloud_top_height_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud top height (within-footprint standard deviation) (NOAA20)
      units: "km"
  cldpix_cloud_particle_radius:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Effective cloud particle radius blended (CLDPIX Cld_Radius) (NOAA20)
      units: "um"
  cldpix_cloud_particle_radius_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Effective cloud particle radius blended (CLDPIX Cld_Radius) (within-footprint standard deviation) (NOAA20)
      units: "um"
  cldpix_cloud_particle_phase:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud particle phase (NOAA20)
  cldpix_cloud_mask:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: CERES cloud mask (NOAA20)
  # --- source reader: era5_single_level (resolution 25.0 km) ---
  era5_single_level_wind_u10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastward wind component at 10 m (ECMWF)
      units: "m/s"
  era5_single_level_wind_u10_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastward wind component at 10 m (within-footprint standard deviation) (ECMWF)
      units: "m/s"
  era5_single_level_wind_v10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northward wind component at 10 m (ECMWF)
      units: "m/s"
  era5_single_level_wind_v10_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northward wind component at 10 m (within-footprint standard deviation) (ECMWF)
      units: "m/s"
  era5_single_level_temperature_2m:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Air temperature at 2 m (ECMWF)
      units: "K"
  era5_single_level_temperature_2m_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Air temperature at 2 m (within-footprint standard deviation) (ECMWF)
      units: "K"
  era5_single_level_dew_point_temperature_2m:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Dewpoint temperature at 2 m (ECMWF)
      units: "K"
  era5_single_level_dew_point_temperature_2m_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Dewpoint temperature at 2 m (within-footprint standard deviation) (ECMWF)
      units: "K"
  era5_single_level_surface_pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface pressure (ECMWF)
      units: "Pa"
  era5_single_level_surface_pressure_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface pressure (within-footprint standard deviation) (ECMWF)
      units: "Pa"
  era5_single_level_surface_geopotential:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface geopotential (orography x standard gravity) (ECMWF)
      units: "m^2/s^2"
  era5_single_level_surface_geopotential_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface geopotential (orography x standard gravity) (within-footprint standard deviation) (ECMWF)
      units: "m^2/s^2"
  era5_single_level_forecast_albedo:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Forecast albedo (broadband surface albedo) (ECMWF)
      units: "1"
  era5_single_level_forecast_albedo_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Forecast albedo (broadband surface albedo) (within-footprint standard deviation) (ECMWF)
      units: "1"
  # --- source reader: era5_pressure (resolution 25.0 km) ---
  era5_pressure_temperature:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Air temperature on ERA5 pressure levels (ECMWF)
      units: "K"
  era5_pressure_temperature_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Air temperature on ERA5 pressure levels (within-footprint standard deviation) (ECMWF)
      units: "K"
  era5_pressure_geopotential:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Geopotential on ERA5 pressure levels (ECMWF)
      units: "m^2/s^2"
  era5_pressure_geopotential_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Geopotential on ERA5 pressure levels (within-footprint standard deviation) (ECMWF)
