  FLASHFlux_Cloud_Water_Particle_Radius_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of effective cloud water particle radius at 3.7 um (FLASHFlux lower layer), PSF-weighted over within-footprint values (NOAA20)
      units: "um"
  FLASHFlux_Cloud_Ice_Particle_Radius_Lower:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Effective cloud ice particle radius at 3.7 um (FLASHFlux lower layer) (NOAA20)
