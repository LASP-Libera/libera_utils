  ERA5_Pressure_Ozone_Mass_Mixing_Ratio_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Standard deviation of ozone mass mixing ratio on ERA5 pressure levels, PSF-weighted over within-footprint values (ECMWF)
      units: "kg/kg"
  ERA5_Pressure_Specific_Humidity:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Specific humidity on ERA5 pressure levels (ECMWF)
      units: "kg/kg"
  ERA5_Pressure_Specific_Humidity_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Standard deviation of specific humidity on ERA5 pressure levels, PSF-weighted over within-footprint values (ECMWF)
      units: "kg/kg"
  ERA5_Pressure_Relative_Humidity:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Relative humidity on ERA5 pressure levels (ECMWF)
      units: "percent"
  ERA5_Pressure_Relative_Humidity_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Standard deviation of relative humidity on ERA5 pressure levels, PSF-weighted over within-footprint values (ECMWF)
      units: "percent"
  # --- source reader: flashflux (resolution 20.0 km) ---
  FLASHFlux_Aerosol_Optical_Depth:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Aerosol optical depth (CERES FLASHFlux) (NOAA20)
  FLASHFlux_Aerosol_Optical_Depth_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of aerosol optical depth (CERES FLASHFlux), PSF-weighted over within-footprint values (NOAA20)
  FLASHFlux_Clear_Coverage:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Clear-sky areal coverage (NOAA20)
      units: "percent"
  FLASHFlux_Clear_Coverage_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of clear-sky areal coverage, PSF-weighted over within-footprint values (NOAA20)
      units: "percent"
  FLASHFlux_Cloud_Optical_Depth_Lower:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (CERES FLASHFlux imager lower layer) (NOAA20)
  FLASHFlux_Cloud_Optical_Depth_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud optical depth (CERES FLASHFlux imager lower layer), PSF-weighted over within-footprint values (NOAA20)
  FLASHFlux_Cloud_Water_Particle_Radius_Lower:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Effective cloud water particle radius at 3.7 um (FLASHFlux lower layer) (NOAA20)
