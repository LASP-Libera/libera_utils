# =============================================================================
# FMATCH-IMAGER Data Product Definition — year-one (ERA5-based) production variant
# =============================================================================
# During the first year of operation the RBSP products (CERES CLDPIX / SSF) that
# feed the post-year-one FMATCH-IMAGER definition are not available, so this
# production definition substitutes ERA5 reanalysis fields: single-level fields
# from the era5 reader and pressure-level fields from the era5_pressure reader
# (13 levels, see _ERA5_PRESSURE_LEVELS in readers/era5_pressure.py).
# The RBSP-based definition is kept as fmatch_imager_post_year_one.yml and is
# selected manually via FmatchVariant.POST_YEAR_ONE once RBSP data flows.
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER
  algorithm_version: null
  date_created: null
  input_files: null

coordinates:
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Radiometer footprint observation time
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  # ---------------------------------------------------------------------------
  # (a) Geolocation inputs (from L1B Daily): lat, lon, alt, sza, vza, raa.
  # ---------------------------------------------------------------------------
  latitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight latitude
      units: degrees_north
      valid_range: [-90, 90]
  longitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight longitude
      units: degrees_east
      valid_range: [-180, 180]
  altitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Spacecraft altitude above reference ellipsoid
      units: meters
  solar_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Solar zenith angle
      units: degrees
      valid_range: [0, 180]
  viewing_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Viewing zenith angle
      units: degrees
      valid_range: [0, 180]
  relative_azimuth_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Relative azimuth angle between Sun and sensor
      units: degrees
      valid_range: [0, 360]

  # ---------------------------------------------------------------------------
  # (b) Derived viewing geometry
  # ---------------------------------------------------------------------------
  sunglint_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sun glint angle
      units: degrees
      valid_range: [0, 180]

  # ---------------------------------------------------------------------------
  # (c) PSF-aggregated external variables (one value per footprint).
  # ---------------------------------------------------------------------------
  # --- source reader: era5 (resolution 25.0 km) ---
  era5_ECMWF_wind_u10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastward wind component at 10 m
      units: "m/s"
  era5_ECMWF_wind_u10_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastward wind component at 10 m (within-footprint standard deviation)
      units: "m/s"
  era5_ECMWF_wind_v10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northward wind component at 10 m
      units: "m/s"
  era5_ECMWF_wind_v10_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northward wind component at 10 m (within-footprint standard deviation)
      units: "m/s"
  era5_ECMWF_temperature_2m:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Air temperature at 2 m
      units: "K"
      valid_range: [170, 350]
  era5_ECMWF_temperature_2m_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Air temperature at 2 m (within-footprint standard deviation)
      units: "K"
  era5_ECMWF_dew_point_temperature_2m:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Dewpoint temperature at 2 m
      units: "K"
      valid_range: [170, 350]
  era5_ECMWF_dew_point_temperature_2m_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Dewpoint temperature at 2 m (within-footprint standard deviation)
      units: "K"
  era5_ECMWF_surface_pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface pressure
      units: "Pa"
      valid_range: [45000, 110000]
  era5_ECMWF_surface_pressure_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface pressure (within-footprint standard deviation)
      units: "Pa"
  era5_ECMWF_surface_geopotential:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface geopotential (orography x standard gravity)
      units: "m^2/s^2"
  era5_ECMWF_surface_geopotential_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface geopotential (orography x standard gravity) (within-footprint standard deviation)
      units: "m^2/s^2"
  era5_ECMWF_forecast_albedo:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Forecast albedo (broadband surface albedo)
