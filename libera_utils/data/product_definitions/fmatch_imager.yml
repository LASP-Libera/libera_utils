  FLASHFlux_Layer_Coverage_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud layer areal coverage, lower layer (CERES FLASHFlux), PSF-weighted over within-footprint values (NOAA20)
