  era5_pressure_specific_humidity_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Specific humidity on ERA5 pressure levels (within-footprint standard deviation) (ECMWF)
      units: "kg/kg"
  era5_pressure_relative_humidity:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Relative humidity on ERA5 pressure levels (ECMWF)
      units: "percent"
  era5_pressure_relative_humidity_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Relative humidity on ERA5 pressure levels (within-footprint standard deviation) (ECMWF)
      units: "percent"
  # --- source reader: igbp (resolution 1.0 km) ---
  igbp_surface_type:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: IGBP surface type classification (MODIS)
  igbp_surface_type_primary:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Most common IGBP surface type in footprint (MODIS)
  igbp_surface_type_secondary:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Second most common IGBP surface type in footprint (MODIS)
  igbp_surface_type_tertiary:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Third most common IGBP surface type in footprint (MODIS)
  # --- source reader: nise (resolution 25.0 km) ---
  nise_sea_ice_concentration:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sea ice concentration (fraction) (AMSR2)
      units: "1"
  nise_sea_ice_concentration_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sea ice concentration (fraction) (within-footprint standard deviation) (AMSR2)
      units: "1"
  nise_snow_free_land:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by snow-free land (NISE code 0) (AMSR2)
      units: "1"
  nise_snow_free_land_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by snow-free land (NISE code 0) (within-footprint standard deviation) (AMSR2)
      units: "1"
  nise_permanent_ice:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by permanent ice (NISE code 101) (AMSR2)
      units: "1"
  nise_permanent_ice_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by permanent ice (NISE code 101) (within-footprint standard deviation) (AMSR2)
      units: "1"
  nise_snow_on_land:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by snow on land (NISE codes 103-104) (AMSR2)
      units: "1"
  nise_snow_on_land_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by snow on land (NISE codes 103-104) (within-footprint standard deviation) (AMSR2)
      units: "1"
  nise_open_ocean:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by ocean (NISE code 255) (AMSR2)
      units: "1"
  nise_open_ocean_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by ocean (NISE code 255) (within-footprint standard deviation) (AMSR2)
      units: "1"
  # --- source reader: ssf (resolution 20.0 km) ---
  ssf_aerosol_optical_depth:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Aerosol optical depth (CERES SSF) (NOAA20)
      units: "1"
  ssf_aerosol_optical_depth_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Aerosol optical depth (CERES SSF) (within-footprint standard deviation) (NOAA20)
      units: "1"
  ssf_clear_coverage:
    dtype: float32
