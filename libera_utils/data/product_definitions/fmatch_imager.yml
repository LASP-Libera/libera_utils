  FLASHFlux_Cloud_Ice_Particle_Radius_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of effective cloud ice particle radius at 3.7 um (FLASHFlux lower layer), PSF-weighted over within-footprint values (NOAA20)
      units: "um"
  FLASHFlux_Cloud_Classification:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: CERES cloud classification code (encoded) (NOAA20)
  FLASHFlux_Shortwave_ADM_Type:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: CERES shortwave ADM scene type (encoded) (NOAA20)
  FLASHFlux_Longwave_ADM_Type:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
