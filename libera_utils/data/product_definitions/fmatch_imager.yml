  ssf_cloud_base_pressure_upper:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Mean cloud base pressure, upper layer (CERES SSF) (NOAA20)
      units: "hPa"
  ssf_cloud_base_pressure_upper_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
