# =============================================================================
# FMATCH-IMAGER Data Product Definition
# =============================================================================
# The radiometer-timescale FMATCH-IMAGER product at RBSP Climate Quality latency:
# one footprint per RADIOMETER_TIME. It carries the RBSP CLDPIX/FLASHFlux cloud fields
# alongside the full ERA5 single-level and pressure-level field set and the VIIRS
# imager fields. The pressure-level fields are 2-D on (RADIOMETER_TIME, PRESSURE_LEVEL),
# all 37 levels (see _ERA5_PRESSURE_LEVELS in readers/era5_pressure.py).
# The active reader set is declared in FMATCH_MODE_READERS[IMAGER]
# (readers/registry.py).
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER
  algorithm_version: null
  InputGranules: null # TODO[LIBSDC-869]: Update once umm-g writer is implemented

coordinates:
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Radiometer footprint observation time
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  PRESSURE_LEVEL:
    dtype: float32
    dimensions: ["PRESSURE_LEVEL"]
    attributes:
      long_name: ERA5 pressure level
      standard_name: air_pressure
      units: hPa
      # CF positive: pressure increases downward, toward the surface, so 1000 hPa lies below 1 hPa.
      positive: down

variables:
  # ---------------------------------------------------------------------------
  # Geolocation and viewing angles: passed through unchanged from L1B Daily at
  #     the footprint boresight.
  # ---------------------------------------------------------------------------
  Latitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic latitude. Coordinate Reference System WGS84
      units: degrees_north
  Longitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Longitude. Coordinate Reference System WGS84
      units: degrees_east
  Altitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      # This value is the L1B RAD `Altitude` field: the height above the WGS84 ellipsoid
      # (EPSG:4979) of the boresight's geolocated point -- NOT the ~835 km spacecraft altitude.
      long_name: Height above the WGS84 ellipsoid. EPSG:4979
      units: meters
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic zenith angle at the Earth point of the Sun
      units: degrees
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic angle at the Earth point to the satellite
      units: degrees
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic azimuth angle at the Earth point of the satellite relative to the solar plane (measured clockwise in the plane normal to the geodetic zenith)
      units: degrees

  # ---------------------------------------------------------------------------
  # Derived viewing geometry: computed here from the angles above (CERES/SSF heritage).
  # ---------------------------------------------------------------------------
  Sunglint_Angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # PSF-aggregated external variables: aggregated here from external sources
  #     with the PSF weights, one value per footprint.
  #     Variable names are product_variable_name(<source_key>_<spec_name>); the source instrument is
  #     recorded in each variable's long_name as "... (INSTRUMENT)".
  # ---------------------------------------------------------------------------
  # --- source reader: cldpix (resolution 1.0 km) ---
  CLDPIX_Cloud_Optical_Depth:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (NOAA20)
  CLDPIX_Cloud_Optical_Depth_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud optical depth (RBSP CLDPIX), PSF-weighted over positive within-footprint values (NOAA20)
  CLDPIX_Cloud_Water_Path:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud water path (NOAA20)
      units: "g/m^2"
  CLDPIX_Cloud_Water_Path_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud water path, PSF-weighted over within-footprint values (NOAA20)
      units: "g/m^2"
  CLDPIX_Cloud_Effective_Temperature:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective temperature (NOAA20)
      units: "K"
  CLDPIX_Cloud_Effective_Temperature_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud effective temperature, PSF-weighted over within-footprint values (NOAA20)
      units: "K"
  CLDPIX_Cloud_Effective_Height:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective height (NOAA20)
      units: "km"
  CLDPIX_Cloud_Effective_Height_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud effective height, PSF-weighted over within-footprint values (NOAA20)
      units: "km"
  CLDPIX_Cloud_Effective_Pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective pressure (NOAA20)
      units: "hPa"
  CLDPIX_Cloud_Effective_Pressure_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud effective pressure, PSF-weighted over within-footprint values (NOAA20)
      units: "hPa"
  CLDPIX_Cloud_Top_Height:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud top height (NOAA20)
      units: "km"
  CLDPIX_Cloud_Top_Height_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud top height, PSF-weighted over within-footprint values (NOAA20)
      units: "km"
  CLDPIX_Cloud_Particle_Radius:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Effective cloud particle radius blended (CLDPIX Cld_Radius) (NOAA20)
      units: "um"
  CLDPIX_Cloud_Particle_Radius_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of effective cloud particle radius blended (CLDPIX Cld_Radius), PSF-weighted over within-footprint values (NOAA20)
      units: "um"
  CLDPIX_Cloud_Particle_Phase:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: Cloud particle phase (NOAA20)
  CLDPIX_Cloud_Mask:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: CERES cloud mask (NOAA20)
  # --- source reader: era5_surface (resolution 28.0 km) ---
  ERA5_Surface_Wind_U10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastward wind component at 10 m (ECMWF)
      units: "m/s"
  ERA5_Surface_Wind_U10_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of eastward wind component at 10 m, PSF-weighted over within-footprint values (ECMWF)
      units: "m/s"
  ERA5_Surface_Wind_V10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northward wind component at 10 m (ECMWF)
      units: "m/s"
  ERA5_Surface_Wind_V10_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of northward wind component at 10 m, PSF-weighted over within-footprint values (ECMWF)
      units: "m/s"
  ERA5_Surface_Temperature_2m:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Air temperature at 2 m (ECMWF)
      units: "K"
  ERA5_Surface_Temperature_2m_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of air temperature at 2 m, PSF-weighted over within-footprint values (ECMWF)
      units: "K"
  ERA5_Surface_Dew_Point_Temperature_2m:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Dewpoint temperature at 2 m (ECMWF)
      units: "K"
  ERA5_Surface_Dew_Point_Temperature_2m_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of dewpoint temperature at 2 m, PSF-weighted over within-footprint values (ECMWF)
      units: "K"
  ERA5_Surface_Surface_Pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface pressure (ECMWF)
      units: "Pa"
  ERA5_Surface_Surface_Pressure_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of surface pressure, PSF-weighted over within-footprint values (ECMWF)
      units: "Pa"
  ERA5_Surface_Surface_Geopotential:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Surface geopotential (orography x standard gravity) (ECMWF)
      units: "m^2/s^2"
  ERA5_Surface_Surface_Geopotential_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of surface geopotential (orography x standard gravity), PSF-weighted over within-footprint values (ECMWF)
      units: "m^2/s^2"
  ERA5_Surface_Forecast_Albedo:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Forecast albedo (broadband surface albedo) (ECMWF)
  ERA5_Surface_Forecast_Albedo_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of forecast albedo (broadband surface albedo), PSF-weighted over within-footprint values (ECMWF)
  # --- source reader: era5_pressure (resolution 28.0 km) ---
  ERA5_Pressure_Temperature:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Air temperature on ERA5 pressure levels (ECMWF)
      units: "K"
  ERA5_Pressure_Temperature_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Standard deviation of air temperature on ERA5 pressure levels, PSF-weighted over within-footprint values (ECMWF)
