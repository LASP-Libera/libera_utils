  ERA5_Pressure_Geopotential:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Geopotential on ERA5 pressure levels (ECMWF)
      units: "m^2/s^2"
  ERA5_Pressure_Geopotential_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME", "PRESSURE_LEVEL"]
    attributes:
      long_name: Standard deviation of geopotential on ERA5 pressure levels, PSF-weighted over within-footprint values (ECMWF)
