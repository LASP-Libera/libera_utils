# =============================================================================
# FMATCH-IMAGER Data Product Definition
# =============================================================================
# The radiometer-timescale FMATCH-IMAGER product at RBSP Climate Quality latency:
# one footprint per RADIOMETER_TIME. It carries the RBSP CLDPIX/SSF cloud fields
# alongside the full ERA5 single-level and pressure-level field set (all 37 levels,
# see _ERA5_PRESSURE_LEVELS in readers/era5_pressure.py) and the VIIRS imager fields.
# The active reader set is declared in FMATCH_MODE_READERS[IMAGER]
# (readers/registry.py).
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER
  algorithm_version: null
  input_files: null

coordinates:
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Radiometer footprint observation time
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  # ---------------------------------------------------------------------------
  # (a) Geolocation inputs (from L1B Daily): lat, lon, alt, sza, vza, raa.
  # ---------------------------------------------------------------------------
  latitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight latitude
      units: degrees_north
  longitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight longitude
      units: degrees_east
  altitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Spacecraft altitude above reference ellipsoid
      units: meters
  solar_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Solar zenith angle
      units: degrees
  viewing_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Viewing zenith angle
      units: degrees
  relative_azimuth_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Relative azimuth angle between Sun and sensor
      units: degrees

  # ---------------------------------------------------------------------------
  # (b) Derived viewing geometry
  # ---------------------------------------------------------------------------
  sunglint_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # (c) PSF-aggregated external variables (one value per footprint).
  # ---------------------------------------------------------------------------
  # --- source reader: cldpix (resolution 1.0 km) ---
  cldpix_cloud_optical_depth:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (NOAA20)
      units: "1"
  cldpix_cloud_optical_depth_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (within-footprint standard deviation) (NOAA20)
      units: "1"
  cldpix_cloud_water_path:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud water path (NOAA20)
      units: "g/m^2"
  cldpix_cloud_water_path_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud water path (within-footprint standard deviation) (NOAA20)
      units: "g/m^2"
  cldpix_cloud_effective_temperature:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective temperature (NOAA20)
      units: "K"
  cldpix_cloud_effective_temperature_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective temperature (within-footprint standard deviation) (NOAA20)
      units: "K"
  cldpix_cloud_effective_height:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective height (NOAA20)
      units: "km"
  cldpix_cloud_effective_height_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective height (within-footprint standard deviation) (NOAA20)
      units: "km"
  cldpix_cloud_effective_pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective pressure (NOAA20)
      units: "hPa"
  cldpix_cloud_effective_pressure_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud effective pressure (within-footprint standard deviation) (NOAA20)
      units: "hPa"
  cldpix_cloud_top_height:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud top height (NOAA20)
      units: "km"
  cldpix_cloud_top_height_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud top height (within-footprint standard deviation) (NOAA20)
      units: "km"
  cldpix_cloud_particle_radius:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Effective cloud particle radius blended (CLDPIX Cld_Radius) (NOAA20)
      units: "um"
  cldpix_cloud_particle_radius_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
