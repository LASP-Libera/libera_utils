# =============================================================================
# FMATCH-IMAGER Data Product Definition — POST-YEAR-ONE variant
# =============================================================================
# The post-year-one FMATCH-IMAGER definition, used once the RBSP products (CERES
# CLDPIX / SSF cloud and aerosol inputs) begin to flow. Those products are NOT
# available during the first year of operation, so this definition is NOT used by
# production algorithms until the RBSP data flow begins; production uses
# fmatch_imager.yml (the year-one variant) by default. Select this variant
# manually via FmatchVariant.POST_YEAR_ONE (e.g. a runner's --post-year-one flag).
#
# This variant carries the RBSP CLDPIX/SSF fields IN ADDITION TO the full ERA5
# single-level and pressure-level field set (all 37 levels, see _ERA5_PRESSURE_LEVELS
# in readers/era5_pressure.py). The ERA5 fields began as year-one substitutes for
# the unavailable RBSP inputs and are retained here alongside RBSP; the only
# variables that differ between the two variants are the RBSP CLDPIX/SSF fields,
# which this post-year-one definition adds.
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER
  algorithm_version: null
  input_files: null

coordinates:
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Radiometer footprint observation time
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  # ---------------------------------------------------------------------------
  # (a) Geolocation inputs (from L1B Daily): lat, lon, alt, sza, vza, raa.
  # ---------------------------------------------------------------------------
  latitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight latitude
      units: degrees_north
  longitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Footprint boresight longitude
      units: degrees_east
  altitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Spacecraft altitude above reference ellipsoid
      units: meters
  solar_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Solar zenith angle
      units: degrees
  viewing_zenith_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Viewing zenith angle
      units: degrees
  relative_azimuth_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Relative azimuth angle between Sun and sensor
      units: degrees

  # ---------------------------------------------------------------------------
  # (b) Derived viewing geometry
  # ---------------------------------------------------------------------------
  sunglint_angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # (c) PSF-aggregated external variables (one value per footprint).
  # ---------------------------------------------------------------------------
  # --- source reader: cldpix (resolution 1.0 km) ---
  cldpix_NOAA20_cloud_optical_depth:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX)
      units: "1"
  cldpix_NOAA20_cloud_optical_depth_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (within-footprint standard deviation)
      units: "1"
  cldpix_NOAA20_cloud_water_path:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud water path
      units: "g/m^2"
  cldpix_NOAA20_cloud_water_path_standard_deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
