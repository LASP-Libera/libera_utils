# =============================================================================
# FMATCH-CAM Data Product Definition
# =============================================================================

attributes:
  ProductID: FMATCH-CAM
  algorithm_version: null
  InputGranules: null # TODO[LIBSDC-869]: Update once umm-g writer is implemented

coordinates:
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Radiometer footprint observation time
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  # ---------------------------------------------------------------------------
  # Geolocation and viewing angles: passed through unchanged from L1B Daily at
  #     the footprint boresight.
  # ---------------------------------------------------------------------------
  Latitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic latitude. Coordinate Reference System WGS84
      units: degrees_north
  Longitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Longitude. Coordinate Reference System WGS84
      units: degrees_east
  Altitude:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      # This value is the L1B RAD `Altitude` field: the height above the WGS84 ellipsoid
      # (EPSG:4979) of the boresight's geolocated point -- NOT the ~835 km spacecraft altitude.
      long_name: Height above the WGS84 ellipsoid. EPSG:4979
      units: meters
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic zenith angle at the Earth point of the Sun
      units: degrees
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic angle at the Earth point to the satellite
      units: degrees
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic azimuth angle at the Earth point of the satellite relative to the solar plane (measured clockwise in the plane normal to the geodetic zenith)
      units: degrees

  # ---------------------------------------------------------------------------
  # Derived viewing geometry: computed here from the angles above to
  #     characterize the Sun-surface-sensor scattering geometry (CERES/SSF
  #     heritage). They are stored on the product so downstream consumers
  #     (Scene ID, ADM binning) do not have to recompute them.
  # ---------------------------------------------------------------------------
  Sunglint_Angle:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      # Angle between the sensor view direction and the specular (mirror)
      # reflection of the solar beam. Small values flag potential sun glint.
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # PSF-aggregated external variables: aggregated here from external sources
  #     with the PSF weights, one value per footprint.
  #     Variable names are <READER_KEY>_<spec name>; the source instrument is
  #     recorded in each variable's long_name as "... (INSTRUMENT)".
  # ---------------------------------------------------------------------------
  # --- source reader: ERA5_Surface (resolution 28.0 km) ---
  ERA5_Surface_Wind_U10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastward wind component at 10 m (ECMWF)
      units: m/s
  ERA5_Surface_Wind_U10_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of eastward wind component at 10 m, PSF-weighted over within-footprint values (ECMWF)
      units: m/s
  ERA5_Surface_Wind_V10:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northward wind component at 10 m (ECMWF)
      units: m/s
  ERA5_Surface_Wind_V10_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of northward wind component at 10 m, PSF-weighted over within-footprint values (ECMWF)
      units: m/s
  # --- source reader: IGBP (resolution 0.463 km) ---
  IGBP_Surface_Type:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: IGBP surface type classification (MODIS)
  IGBP_Surface_Type_Primary:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: Most common IGBP surface type in footprint (MODIS)
  IGBP_Surface_Type_Secondary:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: Second most common IGBP surface type in footprint (MODIS)
  IGBP_Surface_Type_Tertiary:
    dtype: int16
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      _FillValue: -1
      long_name: Third most common IGBP surface type in footprint (MODIS)
  # --- source reader: NISE (resolution 25.0 km) ---
  NISE_Sea_Ice_Concentration:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Sea ice concentration over the footprint (fraction) (AMSR2)
  NISE_Sea_Ice_Concentration_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of sea ice concentration (fraction), PSF-weighted over within-footprint values (AMSR2)
  NISE_Snow_Free_Land:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by snow-free land (NISE code 0) (AMSR2)
  NISE_Snow_Free_Land_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by snow-free land (NISE code 0), PSF-weighted over within-footprint values (AMSR2)
  NISE_Permanent_Ice:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by permanent ice (NISE code 101) (AMSR2)
  NISE_Permanent_Ice_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by permanent ice (NISE code 101), PSF-weighted over within-footprint values (AMSR2)
  NISE_Snow_On_Land:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by snow on land (NISE codes 103-104) (AMSR2)
  NISE_Snow_On_Land_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by snow on land (NISE codes 103-104), PSF-weighted over within-footprint values (AMSR2)
  NISE_Open_Ocean:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of footprint covered by ocean (NISE code 255) (AMSR2)
  NISE_Open_Ocean_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by ocean (NISE code 255), PSF-weighted over within-footprint values (AMSR2)
  # --- source reader: VIIRS_BRDF (resolution 5.6 km) ---
  # BRDF (Bidirectional Reflectance Distribution Function): how surface reflectance
  # varies with the Sun and view angles. VJ143C1 gives it as the weights of the
  # RossThick-LiSparse (RTLS) kernel model, R = fiso + fvol * kvol + fgeo * kgeo:
  # isotropic (fiso), volumetric (fvol) and geometric (fgeo), per broadband
  # (shortwave/vis/nir), named VIIRS_BRDF_<Band>_<Param>. Source: VIIRS BRDF/Albedo
  # (VNP43) User Guide.
  VIIRS_BRDF_Shortwave_Fiso:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Shortwave BRDF isotropic kernel weight (NOAA20)
  VIIRS_BRDF_Shortwave_Fiso_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of shortwave BRDF isotropic kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_Shortwave_Fvol:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Shortwave BRDF volumetric kernel weight (NOAA20)
  VIIRS_BRDF_Shortwave_Fvol_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of shortwave BRDF volumetric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_Shortwave_Fgeo:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Shortwave BRDF geometric kernel weight (NOAA20)
  VIIRS_BRDF_Shortwave_Fgeo_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of shortwave BRDF geometric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_VIS_Fiso:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Visible BRDF isotropic kernel weight (NOAA20)
  VIIRS_BRDF_VIS_Fiso_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of visible BRDF isotropic kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_VIS_Fvol:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Visible BRDF volumetric kernel weight (NOAA20)
  VIIRS_BRDF_VIS_Fvol_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of visible BRDF volumetric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_VIS_Fgeo:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Visible BRDF geometric kernel weight (NOAA20)
  VIIRS_BRDF_VIS_Fgeo_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of visible BRDF geometric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_NIR_Fiso:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Near-infrared BRDF isotropic kernel weight (NOAA20)
  VIIRS_BRDF_NIR_Fiso_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of near-infrared BRDF isotropic kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_NIR_Fvol:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Near-infrared BRDF volumetric kernel weight (NOAA20)
  VIIRS_BRDF_NIR_Fvol_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of near-infrared BRDF volumetric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_NIR_Fgeo:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Near-infrared BRDF geometric kernel weight (NOAA20)
  VIIRS_BRDF_NIR_Fgeo_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of near-infrared BRDF geometric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  # --- source reader: VIIRS_CLDPROP_D3 (resolution 111.0 km) ---
  # valid_min/valid_max are the CLDPROP_D3_VIIRS_NOAA20 Cloud_Optical_Thickness_Combined group's
  #     valid_min/valid_max. A PSF-weighted mean of in-range cells stays in that range; the reader
  #     masks only the source _FillValue and does not reject out-of-range cells.
  VIIRS_CLDPROP_D3_Cloud_Optical_Thickness:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud optical thickness for combined phase clouds (primary retrieval for cloudy scenes), daily L3 mean (NOAA20)
      valid_min: 0.0
      valid_max: 150.0
  VIIRS_CLDPROP_D3_Cloud_Optical_Thickness_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud optical thickness for combined phase clouds (primary retrieval for cloudy scenes), PSF-weighted over within-footprint daily L3 means (NOAA20)
  VIIRS_CLDPROP_D3_Cloud_Top_Pressure:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Cloud top pressure (NOAA20)
      units: hPa
  VIIRS_CLDPROP_D3_Cloud_Top_Pressure_Standard_Deviation:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Standard deviation of cloud top pressure, PSF-weighted over within-footprint values (NOAA20)
      units: hPa
  # ---------------------------------------------------------------------------
  # Libera WFOV CAM algorithm outputs: passed through from Libera's CF-CAM
  #     product, already one value per footprint (NOT from external readers).
  # ---------------------------------------------------------------------------
  Cloud_Fraction_Camera:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      # Per-footprint cloud fraction from the Camera Cloud Fraction (CF-CAM)
      # algorithm using Libera's Wide Field-of-View (WFOV) camera. Already
      # aggregated to one value per footprint upstream, so it is attached
      # directly to the FMATCH record (no reader / PSF step here). Carried in
      # percent [0, 100] matching the CF-CAM input; SCENE-ID ingests it as-is.
      # Percent in every product that carries cloud fraction (Data Product
      # Definition Working Group, 2026-08-19).
      long_name: Cloud fraction (Libera WFOV)
      units: percent
  # ---------------------------------------------------------------------------
  # Coverage / QA: computed here from the PSF bounding box and each source's coverage.
  # ---------------------------------------------------------------------------
  PSF_Bbox_Lat_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Southern latitude bound of PSF bounding box
      units: degrees_north
  PSF_Bbox_Lat_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Northern latitude bound of PSF bounding box
      units: degrees_north
  PSF_Bbox_Lon_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Western longitude bound of PSF bounding box
      units: degrees_east
      comment: "In [-180, 180). A box crossing the antimeridian has PSF_Bbox_Lon_Min > PSF_Bbox_Lon_Max."
  PSF_Bbox_Lon_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Eastern longitude bound of PSF bounding box
      units: degrees_east
      comment: "In [-180, 180). A box crossing the antimeridian has PSF_Bbox_Lon_Min > PSF_Bbox_Lon_Max."
  PSF_Coverage_Fraction:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Fraction of PSF energy covered by valid ancillary data
  Quality_Flag:
    # int32 (not int64): only a handful of bits are defined, so a 64-bit width is unnecessary.
    dtype: int32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Quality flags (bitwise)
      # CF flag metadata for the bits set by FmatchCoverageFlag:
      #   1 = partial_coverage       (75% <= PSF-energy coverage < 95%)
      #   4 = insufficient_coverage  (PSF-energy coverage < 75%; retained but flagged)
      #   8 = limb_truncated         (bounding box clipped at the Earth's limb)
      #  16 = off_limb               (view centroid off the limb; no Earth footprint,
      #                                external variables left at fill)
      flag_masks: [1, 4, 8, 16]
      flag_meanings: "partial_coverage insufficient_coverage limb_truncated off_limb"
