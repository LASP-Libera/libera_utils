# Libera SCENE-ID-IMAGER-CAMTIME product definition.
#
# Camera-timescale counterpart of SCENE-ID-IMAGER. Fed by the FMATCH-IMAGER-CAMTIME product (see
# FootprintData.from_fmatch_imager_camtime). Like SCENE-ID-IMAGER it runs the full TRMM classification in addition to
# ERBE and unfiltering, because the FMATCH-IMAGER-CAMTIME carries the TRMM inputs: surface wind (from
# ERA5_Surface_Wind_U10 / V10), cloud phase (from CLDPIX_Cloud_Particle_Phase), and cloud optical depth (from
# CLDPIX_Cloud_Optical_Depth). Unlike the radiometer-timescale
# SCENE-ID-IMAGER, the product is defined on the 2-D (CAMERA_TIME, PSEUDOFOOTPRINT) grid and additionally carries the
# footprint identifier variables (boresight geolocation, PSF bounding box, and camera pixel-block bounds) straight
# through from the FMATCH input, exactly like SCENE-ID-CAM-CAMTIME.

attributes:
  ProductID: SCENE-ID-IMAGER-CAMTIME
  # Populated at write time by the runner / write_libera_data_product (present but per-file), matching the other
  # Libera product definitions.
  algorithm_version: null
  # Provenance attribute set at write time by the shared SCENE-ID runner (create_and_write_data_product), matching
  # the SCENE-ID-CAM products. TODO[LIBSDC-822]: Update once umm-g writer is implemented.
  InputGranules: null

coordinates:
  # The product is defined on a 2-D (CAMERA_TIME, PSEUDOFOOTPRINT) grid: each classified subsection is identified by the
  # combination of the time its image was taken (CAMERA_TIME) and which spatial subsection of that image it is
  # (PSEUDOFOOTPRINT). Both are coordinates and every data variable hangs on both dimensions.
  #
  # PSEUDOFOOTPRINT is the pseudo-footprint (image subsection) index within a single camera image: a positional 0-based
  # index with no physical units, generated by the runner at write time. Subsections may overlap in pixel space and
  # do not tile the image.
  PSEUDOFOOTPRINT:
    dtype: int32
    dimensions: ["PSEUDOFOOTPRINT"]
    attributes:
      long_name: >-
        Pseudo-footprint (image subsection) index within a single camera image. Paired with CAMERA_TIME, the
        composite (CAMERA_TIME, PSEUDOFOOTPRINT) identifies each classified subsection.
  #
  # CAMERA_TIME is the image acquisition-time axis: one 2048x2048 image = one camera time, and records are always
  # emitted in CAMERA_TIME order. It is a SHARED coordinate across the Libera camera-timescale products: for a given
  # date, FMATCH-IMAGER-CAMTIME and SCENE-ID-IMAGER-CAMTIME carry the *identical* CAMERA_TIME values so records align
  # 1:1. The values are absolute datetimes; the encoding re-expresses them as int64 "nanoseconds since 1958-01-01"
  # (the CCSDS epoch used across Libera products).
  # TODO[LIBSDC-847]: CAMERA_TIME is currently assumed unique per image, but video mode produces sequential images
  # that share an identical timestamp, so uniqueness will not hold there. Video-mode handling is still TBD (the
  # current plan is a separate dimension for video images); revisit this axis once that is decided.
  CAMERA_TIME:
    dtype: datetime64[ns]
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Camera image acquisition time (UTC) against a base reference of the CCSDS Epoch (January 1, 1958). One unique
        entry per image; every PSEUDOFOOTPRINT of that image shares this time via the (CAMERA_TIME, PSEUDOFOOTPRINT) grid.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  ########################
  # Input scene properties
  ########################
  IGBP_Surface_Type:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: 255
      long_name: IGBP (International Geosphere-Biosphere Programme) land cover classification code (MODIS)
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Solar zenith angle at the footprint surface
      units: degrees
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Instrument viewing zenith angle at the footprint surface
      units: degrees
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Relative azimuth angle between the solar and viewing directions at the footprint surface
      units: degrees

  ##########################
  # Derived scene properties
  ##########################
  Surface_Type:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: 255
      long_name: TRMM surface type mapped from the IGBP land cover code (0 = ocean ... 5 = snow)
  Cloud_Fraction:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Total cloud fraction over the footprint, 100 - FLASHFlux_Clear_Coverage (CERES FLASHFlux clear-sky coverage)
      units: percent
  Surface_Wind:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Surface wind speed magnitude, sqrt(u10^2 + v10^2) from the ERA5 10 m wind components
      units: m/s
  Cloud_Phase:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      # 1 = liquid, 2 = ice, NaN = unknown/unavailable. Mapped from FMATCH's CLDPIX_Cloud_Particle_Phase; a NaN
      # leaves the footprint unmatched for any TRMM scene that bounds Cloud_Phase.
      long_name: Dominant cloud phase (1 = liquid, 2 = ice)
  Optical_Depth:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud optical depth (FMATCH CLDPIX_Cloud_Optical_Depth)
      units: "1"

  ############
  # Scene IDs
  ############
  Scene_ID_ERBE:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: ERBE-like scene classification ID (0 = unmatched, 1-11 = scene)
  Scene_ID_Unfiltering:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Unfiltering scene classification ID (0 = unmatched, 1-11 = scene)
  Scene_ID_TRMM:
    dtype: uint16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      # uint16 (not uint8): the TRMM definition assigns scene IDs up to 650, which overflows a single byte.
      long_name: TRMM scene classification ID (0 = unmatched, 1-650 = scene)

  ##############################
  # ERBE scene property-bin bounds
  ##############################
  Scene_Bin_ERBE_Cloud_Fraction_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Cloud_Fraction bin of the matched ERBE scene
      units: percent
  Scene_Bin_ERBE_Cloud_Fraction_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Cloud_Fraction bin of the matched ERBE scene
      units: percent
  Scene_Bin_ERBE_Surface_Type_Min:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Surface_Type bin of the matched ERBE scene
  Scene_Bin_ERBE_Surface_Type_Max:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Surface_Type bin of the matched ERBE scene
  Scene_Bin_ERBE_Solar_Zenith_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Solar_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Solar_Zenith_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Solar_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Viewing_Zenith_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Viewing_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Viewing_Zenith_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Viewing_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Relative_Azimuth_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Relative_Azimuth_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Relative_Azimuth_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Relative_Azimuth_Surface bin of the matched ERBE scene
      units: degrees

  #####################################
  # Unfiltering scene property-bin bounds
  #####################################
  Scene_Bin_Unfiltering_Cloud_Fraction_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Cloud_Fraction bin of the matched unfiltering scene
      units: percent
  Scene_Bin_Unfiltering_Cloud_Fraction_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Cloud_Fraction bin of the matched unfiltering scene
      units: percent
  Scene_Bin_Unfiltering_Surface_Type_Min:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Surface_Type bin of the matched unfiltering scene
  Scene_Bin_Unfiltering_Surface_Type_Max:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Surface_Type bin of the matched unfiltering scene
  Scene_Bin_Unfiltering_Solar_Zenith_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Solar_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Solar_Zenith_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Solar_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Viewing_Zenith_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Viewing_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Viewing_Zenith_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Viewing_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Relative_Azimuth_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Relative_Azimuth_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Relative_Azimuth_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Relative_Azimuth_Surface bin of the matched unfiltering scene
      units: degrees

  ##############################
  # TRMM scene property-bin bounds
  ##############################
  Scene_Bin_TRMM_Surface_Type_Min:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Surface_Type bin of the matched TRMM scene
  Scene_Bin_TRMM_Surface_Type_Max:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Surface_Type bin of the matched TRMM scene
  Scene_Bin_TRMM_Surface_Wind_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Surface_Wind bin of the matched TRMM scene
      units: m/s
  Scene_Bin_TRMM_Surface_Wind_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Surface_Wind bin of the matched TRMM scene
      units: m/s
  Scene_Bin_TRMM_Cloud_Fraction_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Cloud_Fraction bin of the matched TRMM scene
      units: percent
  Scene_Bin_TRMM_Cloud_Fraction_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Cloud_Fraction bin of the matched TRMM scene
      units: percent
  Scene_Bin_TRMM_Cloud_Phase_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Cloud_Phase bin of the matched TRMM scene
  Scene_Bin_TRMM_Cloud_Phase_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Cloud_Phase bin of the matched TRMM scene
  Scene_Bin_TRMM_Optical_Depth_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Optical_Depth bin of the matched TRMM scene
      units: "1"
  Scene_Bin_TRMM_Optical_Depth_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Optical_Depth bin of the matched TRMM scene
      units: "1"
  Scene_Bin_TRMM_Solar_Zenith_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Solar_Zenith_Surface bin of the matched TRMM scene
      units: degrees
  Scene_Bin_TRMM_Solar_Zenith_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Solar_Zenith_Surface bin of the matched TRMM scene
      units: degrees
  Scene_Bin_TRMM_Viewing_Zenith_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Viewing_Zenith_Surface bin of the matched TRMM scene
      units: degrees
  Scene_Bin_TRMM_Viewing_Zenith_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Viewing_Zenith_Surface bin of the matched TRMM scene
      units: degrees
  Scene_Bin_TRMM_Relative_Azimuth_Angle_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Lower bound (inclusive) of the Relative_Azimuth_Surface bin of the matched TRMM scene
      units: degrees
  Scene_Bin_TRMM_Relative_Azimuth_Angle_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Upper bound (exclusive) of the Relative_Azimuth_Surface bin of the matched TRMM scene
      units: degrees

  Quality_Flag:
    dtype: uint32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Bit flags indicating the quality of the data
      value_meaning: TBD. Example file from PREFIRE has this information laid out per-bit using [b0], [b1], etc.

  # ===========================================================================================================
  # Footprint identifiers (passed straight through from FMATCH-IMAGER-CAMTIME)
  # ===========================================================================================================
  # These variables are NOT produced by scene identification; they are copied verbatim from the FMATCH-IMAGER-CAMTIME
  # input so a consumer can trace each classified subsection back to its source. They are unique to the
  # camera-timescale product (SCENE-ID-IMAGER has no equivalent). Definitions mirror fmatch_imager_camtime.yml exactly
  # (dtype + attributes) so the two products agree bit-for-bit, and all hang on the (CAMERA_TIME, PSEUDOFOOTPRINT) grid.

  # --- Boresight geolocation -----------------------------------------------------------------------------------------
  # Center-pixel geolocation of the pseudo-footprint (the boresight stand-in). Passed through from the L1B Daily Camera
  # geolocation via FMATCH-IMAGER-CAMTIME.
  Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Footprint boresight latitude
      units: degrees_north
  Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Footprint boresight longitude
      units: degrees_east
  Altitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      # Center-pixel geolocated SURFACE height (terrain elevation above the WGS84 ellipsoid at the footprint
      # boresight) -- NOT the ~835 km spacecraft altitude.
      long_name: Footprint center-pixel surface height above the WGS84 ellipsoid
      units: meters

  # --- PSF bounding box ----------------------------------------------------------------------------------------------
  # Geographic extent of the pseudo-footprint's point-spread-function bounding box, passed through from
  # FMATCH-IMAGER-CAMTIME. Together these four bounds describe the ground footprint the scene was classified over.
  PSF_Bbox_Lat_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Southern latitude bound of PSF bounding box
      units: degrees_north
  PSF_Bbox_Lat_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Northern latitude bound of PSF bounding box
      units: degrees_north
  PSF_Bbox_Lon_Min:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Western longitude bound of PSF bounding box
      units: degrees_east
  PSF_Bbox_Lon_Max:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Eastern longitude bound of PSF bounding box
      units: degrees_east

  # --- Camera pixel-block provenance ---------------------------------------------------------------------------------
  # Each pseudo-footprint is a contiguous block of L1B camera pixels, segmented by the Camera Cloud Fraction algorithm
  # (types.PseudoFootprint). These four
  # inclusive bounds trace a subsection back to its source pixels in the L1B Daily Camera grid (dimensions
  # CAMERA_PIXEL_COUNT_X x CAMERA_PIXEL_COUNT_Y): x_min..x_max along the column axis and y_min..y_max along the row
  # axis, both endpoints inclusive. NOTE: this (x_min, x_max, y_min, y_max) representation assumes each footprint is a
  # square (an axis-aligned rectangular pixel block), so a single min/max pair per axis fully describes it.
  # Subsections may overlap in pixel space. Passed through verbatim from FMATCH-IMAGER-CAMTIME.
  Camera_Pixel_X_Min:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive minimum camera pixel-column index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_X
  Camera_Pixel_X_Max:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive maximum camera pixel-column index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_X
  Camera_Pixel_Y_Min:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive minimum camera pixel-row index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_Y
  Camera_Pixel_Y_Max:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive maximum camera pixel-row index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_Y
