# Libera SCENE-ID-CAM product definition.

attributes:
  ProductID: SCENE-ID-CAM
  # These are populated at write time by the runner / write_libera_data_product (they must be present but their
  # values vary per file).
  algorithm_version: null
  InputGranules: null # TODO[LIBSDC-869]: Update once umm-g writer is implemented

coordinates:
  # RADIOMETER_TIME is a SHARED coordinate across the Libera radiometer-timescale products, with one value per footprint.
  RADIOMETER_TIME:
    dtype: datetime64[ns]
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: >-
        Time of each radiometer footprint observation (UTC) against a base reference of the CCSDS Epoch
        (January 1, 1958). Uniquely identifies each radiometer footprint.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  ########################
  # Input scene properties
  ########################
  IGBP_Surface_Type:
    dtype: int8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      comment: "-1 where the footprint has no surface type; its scene IDs are then 0 (unmatched)."
      long_name: IGBP (International Geosphere-Biosphere Programme) land cover classification code (MODIS)
  # Viewing geometry at the footprint surface (boresight), passed through unchanged from L1B RAD via FMATCH-CAM;
  # long_names are the L1B ones. Relative azimuth is referenced to the Sun: 0 degrees means the viewing azimuth is
  # aligned with the Sun's azimuth.
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic zenith angle at the Earth point of the Sun
      units: degrees
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic angle at the Earth point to the satellite
      units: degrees
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Geodetic azimuth angle at the Earth point of the satellite relative to the solar plane (measured clockwise in the plane normal to the geodetic zenith)
      units: degrees

  ##########################
  # Derived scene properties
  ##########################
  Surface_Type:
    dtype: int8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      comment: "-1 where the footprint has no surface type; its scene IDs are then 0 (unmatched)."
      # Surface-type category used as a scene-classification input, collapsed from the finer IGBP land-cover code.
      # The category values follow the TRMM 6-category scheme, though it is used in all scene classification types.
      long_name: >-
        Surface-type category mapped from the IGBP land-cover code (0 = ocean, 1 = hi_shrub, 2 = low_shrub,
        3 = dark_desert, 4 = bright_desert, 5 = snow)
  # Cloud fraction is in percent in every Libera product that carries it (Data Product Definition Working Group,
  # 2026-08-19).
  Cloud_Fraction:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Total cloud fraction over the footprint, in percent as the L2 CF-CAM data product carries it
      units: percent

  ############
  # Scene IDs
  ############
  Scene_ID_ERBE:
    dtype: uint8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: ERBE-like scene classification ID (0 = unmatched, 1-11 = scene)
  Scene_ID_Unfiltering:
    dtype: uint8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Unfiltering scene classification ID (0 = unmatched, 1-11 = scene)

  ##############################
  # ERBE scene property-bin bounds
  ##############################
  Scene_Bin_ERBE_Cloud_Fraction_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Cloud_Fraction bin of the matched ERBE scene
      units: percent
  Scene_Bin_ERBE_Cloud_Fraction_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Cloud_Fraction bin of the matched ERBE scene
      units: percent
  Scene_Bin_ERBE_Surface_Type_Min:
    dtype: int8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      comment: "-1 for an unmatched footprint (scene ID 0)."
      long_name: Lower bound (inclusive) of the Surface_Type bin of the matched ERBE scene
  Scene_Bin_ERBE_Surface_Type_Max:
    dtype: int8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      comment: "-1 for an unmatched footprint (scene ID 0)."
      long_name: Upper bound (exclusive) of the Surface_Type bin of the matched ERBE scene
  Scene_Bin_ERBE_Solar_Zenith_Surface_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Solar_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Solar_Zenith_Surface_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Solar_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Viewing_Zenith_Surface_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Viewing_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Viewing_Zenith_Surface_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Viewing_Zenith_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Relative_Azimuth_Surface_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Relative_Azimuth_Surface bin of the matched ERBE scene
      units: degrees
  Scene_Bin_ERBE_Relative_Azimuth_Surface_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Relative_Azimuth_Surface bin of the matched ERBE scene
      units: degrees

  #####################################
  # Unfiltering scene property-bin bounds
  #####################################
  Scene_Bin_Unfiltering_Cloud_Fraction_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Cloud_Fraction bin of the matched unfiltering scene
      units: percent
  Scene_Bin_Unfiltering_Cloud_Fraction_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Cloud_Fraction bin of the matched unfiltering scene
      units: percent
  Scene_Bin_Unfiltering_Surface_Type_Min:
    dtype: int8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      comment: "-1 for an unmatched footprint (scene ID 0)."
      long_name: Lower bound (inclusive) of the Surface_Type bin of the matched unfiltering scene
  Scene_Bin_Unfiltering_Surface_Type_Max:
    dtype: int8
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      comment: "-1 for an unmatched footprint (scene ID 0)."
      long_name: Upper bound (exclusive) of the Surface_Type bin of the matched unfiltering scene
  Scene_Bin_Unfiltering_Solar_Zenith_Surface_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Solar_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Solar_Zenith_Surface_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Solar_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Viewing_Zenith_Surface_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Viewing_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Viewing_Zenith_Surface_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Viewing_Zenith_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Relative_Azimuth_Surface_Min:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Lower bound (inclusive) of the Relative_Azimuth_Surface bin of the matched unfiltering scene
      units: degrees
  Scene_Bin_Unfiltering_Relative_Azimuth_Surface_Max:
    dtype: float32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Upper bound (exclusive) of the Relative_Azimuth_Surface bin of the matched unfiltering scene
      units: degrees
  Quality_Flag:
    dtype: uint32
    dimensions: ["RADIOMETER_TIME"]
    attributes:
      long_name: Bit flags indicating the quality of the data
      value_meaning: TBD. Example file from PREFIRE has this information laid out per-bit using [b0], [b1], etc.
