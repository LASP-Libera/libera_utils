# =============================================================================
# FMATCH-IMAGER-CAMTIME Data Product Definition
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER-CAMTIME
  algorithm_version: null
  InputGranules: null # TODO[LIBSDC-869]: Update once umm-g writer is implemented

coordinates:
  # 2-D (CAMERA_TIME, PSEUDOFOOTPRINT) grid: each pseudo-footprint (image subsection) is identified by its image time
  # (CAMERA_TIME) and its subsection index within that image (PSEUDOFOOTPRINT). Both are coordinates; every data variable
  # hangs on both dimensions. This layout is identical to FMATCH-CAM-CAMTIME and SCENE-ID-CAM-CAMTIME.
  #
  # CAMERA_TIME is the SHARED image-acquisition axis (one 2048x2048 image = one entry, unique and sorted), carrying
  # identical values across the camera-timescale products for a given date so records align 1:1.
  # TODO[LIBSDC-847]: video mode emits sequential images sharing a timestamp, so CAMERA_TIME uniqueness will not hold
  # there; revisit once video-mode handling is decided.
  CAMERA_TIME:
    dtype: datetime64[ns]
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Camera image acquisition time (UTC) referenced to the CCSDS Epoch (January 1, 1958); one entry per image.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

  # PSEUDOFOOTPRINT is the 0-based subsection index within a single image, generated at write time. Subsections may overlap
  # in pixel space and do not tile the image.
  PSEUDOFOOTPRINT:
    dtype: int32
    dimensions: ["PSEUDOFOOTPRINT"]
    attributes:
      long_name: >-
        Pseudo-footprint (image subsection) index within a camera image; paired with CAMERA_TIME it identifies each
        subsection.

  # Camera pixel-block provenance: each pseudo-footprint is an axis-aligned block of L1B Daily Camera pixels
  # (CAMERA_PIXEL_COUNT_X x CAMERA_PIXEL_COUNT_Y grid). The four inclusive bounds x_min..x_max (columns) and
  # y_min..y_max (rows) trace it back to those pixels. Blocks may overlap. Declared identically to FMATCH-CAM-CAMTIME.
  Camera_Pixel_X_Min:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Inclusive minimum camera pixel-column index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_X
  Camera_Pixel_X_Max:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Inclusive maximum camera pixel-column index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_X
  Camera_Pixel_Y_Min:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Inclusive minimum camera pixel-row index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_Y
  Camera_Pixel_Y_Max:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Inclusive maximum camera pixel-row index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_Y

variables:
  # ---------------------------------------------------------------------------
  # Center pixel: the boresight (center) pixel of each pseudo-footprint, after any
  #     nearest-valid substitution (see the center_pixel_substituted Quality_Flag bit).
  #     FMATCH-only provenance; no downstream product carries it.
  # ---------------------------------------------------------------------------
  Center_Pixel_X:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Boresight (center) pixel index along CAMERA_PIXEL_COUNT_X
  Center_Pixel_Y:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Boresight (center) pixel index along CAMERA_PIXEL_COUNT_Y

  # ---------------------------------------------------------------------------
  # Geolocation and viewing angles: passed through unchanged from L1B Daily
  #     Camera at each pseudo-footprint's center pixel (the nearest valid pixel
  #     when the center_pixel_substituted Quality_Flag bit is set), not averaged.
  # ---------------------------------------------------------------------------
  Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Geodetic latitude. Coordinate Reference System WGS84
      units: degrees_north
  Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Longitude. Coordinate Reference System WGS84
      units: degrees_east
  Altitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      # This value is the L1B CAM `Altitude` field at the center pixel: the height above the
      # WGS84 ellipsoid (EPSG:4979) of that pixel's geolocated point -- NOT the ~835 km
      # spacecraft altitude.
      long_name: Height above the WGS84 ellipsoid. EPSG:4979
      units: meters
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Geodetic zenith angle at the Earth point of the Sun
      units: degrees
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Geodetic angle at the Earth point to the satellite
      units: degrees
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Geodetic azimuth angle at the Earth point of the satellite relative to the solar plane (measured clockwise in the plane normal to the geodetic zenith)
      units: degrees

  # ---------------------------------------------------------------------------
  # Derived viewing geometry: computed here from the angles above (CERES/SSF
  #     heritage).
  # ---------------------------------------------------------------------------
  Sunglint_Angle:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # PSF-aggregated external variables: aggregated here from external sources
  #     with the PSF weights, one value per footprint.
  #     Variable names are <READER_KEY>_<spec name>; the source instrument is
  #     recorded in each variable's long_name as "... (INSTRUMENT)".
  # ---------------------------------------------------------------------------
  # --- source reader: CLDPIX (resolution 1.0 km) ---
  CLDPIX_Cloud_Optical_Depth:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud optical depth (RBSP CLDPIX) (NOAA20)
  CLDPIX_Cloud_Optical_Depth_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud optical depth (RBSP CLDPIX), PSF-weighted over positive within-footprint values (NOAA20)
  CLDPIX_Cloud_Water_Path:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud water path (NOAA20)
      units: "g/m^2"
  CLDPIX_Cloud_Water_Path_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud water path, PSF-weighted over within-footprint values (NOAA20)
      units: "g/m^2"
  CLDPIX_Cloud_Effective_Temperature:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud effective temperature (NOAA20)
      units: "K"
  CLDPIX_Cloud_Effective_Temperature_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud effective temperature, PSF-weighted over within-footprint values (NOAA20)
      units: "K"
  CLDPIX_Cloud_Effective_Height:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud effective height (NOAA20)
      units: "km"
  CLDPIX_Cloud_Effective_Height_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud effective height, PSF-weighted over within-footprint values (NOAA20)
      units: "km"
  CLDPIX_Cloud_Effective_Pressure:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud effective pressure (NOAA20)
      units: "hPa"
  CLDPIX_Cloud_Effective_Pressure_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud effective pressure, PSF-weighted over within-footprint values (NOAA20)
      units: "hPa"
  CLDPIX_Cloud_Top_Height:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud top height (NOAA20)
      units: "km"
  CLDPIX_Cloud_Top_Height_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud top height, PSF-weighted over within-footprint values (NOAA20)
      units: "km"
  CLDPIX_Cloud_Particle_Radius:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Effective cloud particle radius blended (CLDPIX Cld_Radius) (NOAA20)
      units: "um"
  CLDPIX_Cloud_Particle_Radius_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of effective cloud particle radius blended (CLDPIX Cld_Radius), PSF-weighted over within-footprint values (NOAA20)
      units: "um"
  CLDPIX_Cloud_Particle_Phase:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Cloud particle phase (NOAA20)
  CLDPIX_Cloud_Mask:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: CERES cloud mask (NOAA20)
  # --- source reader: ERA5_Surface (resolution 28.0 km) ---
  ERA5_Surface_Wind_U10:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Eastward wind component at 10 m (ECMWF)
      units: "m/s"
  ERA5_Surface_Wind_U10_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of eastward wind component at 10 m, PSF-weighted over within-footprint values (ECMWF)
      units: "m/s"
  ERA5_Surface_Wind_V10:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Northward wind component at 10 m (ECMWF)
      units: "m/s"
  ERA5_Surface_Wind_V10_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of northward wind component at 10 m, PSF-weighted over within-footprint values (ECMWF)
      units: "m/s"
  ERA5_Surface_Temperature_2m:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Air temperature at 2 m (ECMWF)
      units: "K"
  ERA5_Surface_Temperature_2m_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of air temperature at 2 m, PSF-weighted over within-footprint values (ECMWF)
      units: "K"
  ERA5_Surface_Dew_Point_Temperature_2m:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Dewpoint temperature at 2 m (ECMWF)
      units: "K"
  ERA5_Surface_Dew_Point_Temperature_2m_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of dewpoint temperature at 2 m, PSF-weighted over within-footprint values (ECMWF)
      units: "K"
  ERA5_Surface_Surface_Pressure:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Surface pressure (ECMWF)
      units: "Pa"
  ERA5_Surface_Surface_Pressure_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of surface pressure, PSF-weighted over within-footprint values (ECMWF)
      units: "Pa"
  ERA5_Surface_Surface_Geopotential:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Surface geopotential (orography x standard gravity) (ECMWF)
      units: "m^2/s^2"
  ERA5_Surface_Surface_Geopotential_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of surface geopotential (orography x standard gravity), PSF-weighted over within-footprint values (ECMWF)
      units: "m^2/s^2"
  ERA5_Surface_Forecast_Albedo:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Forecast albedo (broadband surface albedo) (ECMWF)
  ERA5_Surface_Forecast_Albedo_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of forecast albedo (broadband surface albedo), PSF-weighted over within-footprint values (ECMWF)
  # --- source reader: FLASHFlux (resolution 20.0 km) ---
  FLASHFlux_Aerosol_Optical_Depth:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Aerosol optical depth (CERES FLASHFlux) (NOAA20)
  FLASHFlux_Aerosol_Optical_Depth_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of aerosol optical depth (CERES FLASHFlux), PSF-weighted over within-footprint values (NOAA20)
  FLASHFlux_Clear_Coverage:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Clear-sky areal coverage (NOAA20)
      units: "percent"
  FLASHFlux_Clear_Coverage_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of clear-sky areal coverage, PSF-weighted over within-footprint values (NOAA20)
      units: "percent"
  FLASHFlux_Cloud_Optical_Depth_Lower:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Cloud optical depth (CERES FLASHFlux imager lower layer) (NOAA20)
  FLASHFlux_Cloud_Optical_Depth_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of cloud optical depth (CERES FLASHFlux imager lower layer), PSF-weighted over within-footprint values (NOAA20)
  FLASHFlux_Cloud_Water_Particle_Radius_Lower:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Effective cloud water particle radius at 3.7 um (FLASHFlux lower layer) (NOAA20)
      units: "um"
  FLASHFlux_Cloud_Water_Particle_Radius_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of effective cloud water particle radius at 3.7 um (FLASHFlux lower layer), PSF-weighted over within-footprint values (NOAA20)
      units: "um"
  FLASHFlux_Cloud_Ice_Particle_Radius_Lower:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Effective cloud ice particle radius at 3.7 um (FLASHFlux lower layer) (NOAA20)
      units: "um"
  FLASHFlux_Cloud_Ice_Particle_Radius_Lower_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of effective cloud ice particle radius at 3.7 um (FLASHFlux lower layer), PSF-weighted over within-footprint values (NOAA20)
      units: "um"
  FLASHFlux_Cloud_Classification:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: CERES cloud classification code (encoded) (NOAA20)
  FLASHFlux_Shortwave_ADM_Type:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: CERES shortwave ADM scene type (encoded) (NOAA20)
  FLASHFlux_Longwave_ADM_Type:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: CERES longwave ADM scene type (encoded) (NOAA20)
  # --- source reader: IGBP (resolution 0.463 km) ---
  IGBP_Surface_Type:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: IGBP surface type classification (MODIS)
  IGBP_Surface_Type_Primary:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Most common IGBP surface type in footprint (MODIS)
  IGBP_Surface_Type_Secondary:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Second most common IGBP surface type in footprint (MODIS)
  IGBP_Surface_Type_Tertiary:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Third most common IGBP surface type in footprint (MODIS)
  # --- source reader: NISE (resolution 25.0 km) ---
  NISE_Sea_Ice_Concentration:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Sea ice concentration over the footprint (fraction) (AMSR2)
  NISE_Sea_Ice_Concentration_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of sea ice concentration (fraction), PSF-weighted over within-footprint values (AMSR2)
  NISE_Snow_Free_Land:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Fraction of footprint covered by snow-free land (NISE code 0) (AMSR2)
  NISE_Snow_Free_Land_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by snow-free land (NISE code 0), PSF-weighted over within-footprint values (AMSR2)
  NISE_Permanent_Ice:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Fraction of footprint covered by permanent ice (NISE code 101) (AMSR2)
  NISE_Permanent_Ice_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by permanent ice (NISE code 101), PSF-weighted over within-footprint values (AMSR2)
  NISE_Snow_On_Land:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Fraction of footprint covered by snow on land (NISE codes 103-104) (AMSR2)
  NISE_Snow_On_Land_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by snow on land (NISE codes 103-104), PSF-weighted over within-footprint values (AMSR2)
  NISE_Open_Ocean:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Fraction of footprint covered by ocean (NISE code 255) (AMSR2)
  NISE_Open_Ocean_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of fraction of footprint covered by ocean (NISE code 255), PSF-weighted over within-footprint values (AMSR2)
  # --- source reader: VIIRS_AOD (resolution 111.0 km) ---
  VIIRS_AOD_Optical_Depth_550:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Aerosol optical depth at 550 nm (NOAA20)
  VIIRS_AOD_Optical_Depth_550_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of aerosol optical depth at 550 nm, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_AOD_Aerosol_Type:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: "VIIRS Deep Blue aerosol type (land+ocean), modal value (0=dust 1=smoke 2=high-altitude smoke 3=pyrocumulonimbus 4=non-smoke fine mode 5=mixed 6=background maritime 7=fine dominated) (NOAA20)"
  VIIRS_AOD_Aerosol_Type_Primary:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Most common VIIRS Deep Blue aerosol type (land+ocean) in footprint (NOAA20)
  VIIRS_AOD_Aerosol_Type_Secondary:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Second most common VIIRS Deep Blue aerosol type (land+ocean) in footprint (NOAA20)
  VIIRS_AOD_Aerosol_Type_Tertiary:
    dtype: int16
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      _FillValue: -1
      long_name: Third most common VIIRS Deep Blue aerosol type (land+ocean) in footprint (NOAA20)
  # --- source reader: VIIRS_BRDF (resolution 5.6 km) ---
  # BRDF (Bidirectional Reflectance Distribution Function): how surface reflectance
  # varies with the Sun and view angles. VJ143C1 gives it as the weights of the
  # RossThick-LiSparse (RTLS) kernel model, R = fiso + fvol * kvol + fgeo * kgeo:
  # isotropic (fiso), volumetric (fvol) and geometric (fgeo), per broadband
  # (shortwave/vis/nir), named VIIRS_BRDF_<Band>_<Param>. Source: VIIRS BRDF/Albedo
  # (VNP43) User Guide.
  VIIRS_BRDF_Shortwave_Fiso:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Shortwave BRDF isotropic kernel weight (NOAA20)
  VIIRS_BRDF_Shortwave_Fiso_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of shortwave BRDF isotropic kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_Shortwave_Fvol:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Shortwave BRDF volumetric kernel weight (NOAA20)
  VIIRS_BRDF_Shortwave_Fvol_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of shortwave BRDF volumetric kernel weight, PSF-weighted over within-footprint values (NOAA20)
  VIIRS_BRDF_Shortwave_Fgeo:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Shortwave BRDF geometric kernel weight (NOAA20)
  VIIRS_BRDF_Shortwave_Fgeo_Standard_Deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Standard deviation of shortwave BRDF geometric kernel weight, PSF-weighted over within-footprint values (NOAA20)
