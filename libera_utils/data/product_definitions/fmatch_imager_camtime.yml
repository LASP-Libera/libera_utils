# =============================================================================
# FMATCH-IMAGER-CAMTIME Data Product Definition
# =============================================================================

attributes:
  ProductID: FMATCH-IMAGER-CAMTIME
  algorithm_version: null
  input_files: null #

coordinates:
  # FOOTPRINT is the record axis: one entry per pseudo-footprint (image subsection). A record is identified by the
  # composite (CAMERA_TIME, camera_pixel_x, camera_pixel_y); the FOOTPRINT index is the positional unique handle.
  #
  # CAMERA_TIME is a NON-UNIQUE auxiliary coordinate on FOOTPRINT: one 2048x2048 image = one camera time, and the image
  # is segmented into many (possibly overlapping) subsections that all share that time, so CAMERA_TIME repeats across
  # the records of a given image. Records are always emitted in CAMERA_TIME order. This layout is identical to
  # FMATCH-CAM-CAMTIME and SCENE-ID-CAM-CAMTIME.
  CAMERA_TIME:
    dtype: datetime64[ns]
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: >-
        Camera image acquisition time (UTC) against a base reference of the CCSDS Epoch (January 1, 1958) of the full
        image this subsection was segmented from. NOT unique across records: all subsections of one image share it.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

  # Camera pixel-index ranges identifying each subsection's source pixels in the L1B Daily Camera grid. Each range is an
  # inclusive (min, max) pair over the CAMERA_PIXEL_BOUNDS axis: index 0 is the minimum pixel index and index 1 is the
  # maximum, both inclusive. Subsections may overlap in pixel space. Declared identically to FMATCH-CAM-CAMTIME.
  camera_pixel_x:
    dtype: int32
    dimensions: ["FOOTPRINT", "CAMERA_PIXEL_BOUNDS"]
    attributes:
      long_name: >-
        Inclusive (min, max) camera pixel-column index range of the pseudo-footprint block along
        CAMERA_PIXEL_COUNT_X
  camera_pixel_y:
    dtype: int32
    dimensions: ["FOOTPRINT", "CAMERA_PIXEL_BOUNDS"]
    attributes:
      long_name: >-
        Inclusive (min, max) camera pixel-row index range of the pseudo-footprint block along
        CAMERA_PIXEL_COUNT_Y

variables:
  # ---------------------------------------------------------------------------
  # (a) Geolocation inputs (from L1B Daily): lat, lon, alt, sza, vza, raa.
  # ---------------------------------------------------------------------------
  latitude:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Footprint boresight latitude
      units: degrees_north
  longitude:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Footprint boresight longitude
      units: degrees_east
  altitude:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Spacecraft altitude above reference ellipsoid
      units: meters
  solar_zenith_angle:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Solar zenith angle
      units: degrees
  viewing_zenith_angle:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Viewing zenith angle
      units: degrees
  relative_azimuth_angle:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Relative azimuth angle between Sun and sensor
      units: degrees

  # ---------------------------------------------------------------------------
  # (b) Derived viewing geometry (computed from the angles above; CERES/SSF
  #     heritage). Math lives in
  #     libera_utils/footprint_matching/product.compute_derived_viewing_geometry().
  # ---------------------------------------------------------------------------
  sunglint_angle:
    dtype: float32
    dimensions: ["FOOTPRINT"]
    attributes:
      long_name: Sun glint angle
      units: degrees

  # ---------------------------------------------------------------------------
  # (c) PSF-aggregated external variables (one value per footprint).
  # ---------------------------------------------------------------------------
