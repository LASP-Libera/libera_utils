  # ---------------------------------------------------------------------------
  # (e) Camera pixel-block provenance.
  #     Each pseudo-footprint is a contiguous block of L1B camera pixels
  #     (camera_segmentation.PseudoFootprint). The block's inclusive (min, max) extent
  #     on each pixel axis is carried by the camera_pixel_x / camera_pixel_y range
  #     COORDINATES declared above (dims FOOTPRINT x CAMERA_PIXEL_BOUNDS), identical to
  #     fmatch_cam_camtime.yml. The centre-pixel indices below point at the boresight
  #     stand-in, after any nearest-valid substitution (see the center_pixel_substituted
  #     q_flags bit); they are FMATCH-only provenance and are not carried downstream.
  # ---------------------------------------------------------------------------
  center_pixel_x:
    dtype: int32
    dimensions: ["FOOTPRINT"]
