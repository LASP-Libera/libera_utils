# =============================================================================
# CF-CAM-CAMTIME Data Product Definition
# =============================================================================
#
# The camera-timescale Camera Cloud Fraction (CF-CAM-CAMTIME) product. It is produced by the
# placeholder cloud-fraction algorithm (libera_utils/cloud_fraction/) directly from an L1B Daily
# Camera file: the same camera segmentation FMATCH uses turns the pixel grid into pseudo-footprints,
# so this product shares the FMATCH-CAM-CAMTIME record axis and pixel provenance exactly.
#
# It is the cloud-fraction input to FMATCH-CAM-CAMTIME: FMATCH reads `cloud_fraction` here and
# re-emits it as its `cloud_fraction_camera` variable. Because both products come from the same
# deterministic segmentation of the same L1B CAM file, records align 1:1 and are identified by the
# shared (CAMERA_TIME, PSEUDOFOOTPRINT, camera_pixel_{x,y}_{min,max}) provenance coordinates.
#
# NOTE: the cloud-fraction values are a PLACEHOLDER (random, in-range) pending the real Libera WFOV
# cloud-fraction retrieval.

attributes:
  ProductID: CF-CAM-CAMTIME
  algorithm_version: null
  InputGranules: null # TODO[LIBSDC-822]: Update once umm-g writer is implemented

coordinates:
  # 2-D (CAMERA_TIME, PSEUDOFOOTPRINT) grid, declared identically to FMATCH-CAM-CAMTIME: each
  # pseudo-footprint (image subsection) is identified by its image time (CAMERA_TIME) and its
  # subsection index within that image (PSEUDOFOOTPRINT). Both are coordinates; every data variable
  # hangs on both dimensions.
  #
  # CAMERA_TIME is the SHARED image-acquisition axis (one 2048x2048 image = one entry, unique and sorted). For a given
  # date, CF-CAM-CAMTIME and FMATCH-CAM-CAMTIME carry identical CAMERA_TIME values so records align 1:1.
  # TODO[LIBSDC-847]: video mode emits sequential images sharing a timestamp, so CAMERA_TIME uniqueness will not hold
  # there; revisit once video-mode handling is decided.
  CAMERA_TIME:
    dtype: datetime64[ns]
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Camera image acquisition time (UTC) referenced to the CCSDS Epoch (January 1, 1958); one entry per image.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

  # PSEUDOFOOTPRINT is the 0-based subsection index within a single image, generated at write time. Subsections may overlap
  # in pixel space and do not tile the image.
  PSEUDOFOOTPRINT:
    dtype: int32
    dimensions: ["PSEUDOFOOTPRINT"]
    attributes:
      long_name: >-
        Pseudo-footprint (image subsection) index within a camera image; paired with CAMERA_TIME it identifies each
        subsection.

  # Camera pixel-block provenance: each pseudo-footprint is an axis-aligned block of L1B Daily Camera pixels
  # (CAMERA_PIXEL_COUNT_X x CAMERA_PIXEL_COUNT_Y grid). The four inclusive bounds x_min..x_max (columns) and
  # y_min..y_max (rows) trace it back to those pixels. Blocks may overlap. Declared identically to FMATCH-CAM-CAMTIME.
  camera_pixel_x_min:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive minimum camera pixel-column index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_X
  camera_pixel_x_max:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive maximum camera pixel-column index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_X
  camera_pixel_y_min:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive minimum camera pixel-row index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_Y
  camera_pixel_y_max:
    dtype: int32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Inclusive maximum camera pixel-row index of the pseudo-footprint block along CAMERA_PIXEL_COUNT_Y

variables:
  cloud_fraction:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      # Carried in percent [0, 100]. FMATCH-CAM-CAMTIME ingests this as-is into cloud_fraction_camera.
      long_name: Total cloud fraction over the pseudo-footprint (Libera WFOV, PLACEHOLDER)
      units: percent
      valid_range: [0.0, 100.0]
  cloud_fraction_standard_deviation:
    dtype: float32
    dimensions: ["CAMERA_TIME", "PSEUDOFOOTPRINT"]
    attributes:
      long_name: Within-pseudo-footprint standard deviation of cloud fraction (Libera WFOV, PLACEHOLDER)
      units: percent
      valid_range: [0.0, 100.0]
